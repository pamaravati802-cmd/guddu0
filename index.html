<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="A Little Universe — For Guddu 💛">
  <meta name="theme-color" content="#1a0a1e">
  <title>A Little Universe 💛</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- SVG defs for kiss animation -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
    <linearGradient id="lg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff6b97"/><stop offset="1" stop-color="#c2185b"/></linearGradient>
    <linearGradient id="hg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff8fb3"/><stop offset="1" stop-color="#e0357a"/></linearGradient>
    <symbol id="lip" viewBox="0 0 64 40"><path d="M32 10C28 2 14 0 4 18C16 22 26 22 32 18C38 22 48 22 60 18C50 0 36 2 32 10Z" fill="url(#lg)"/><path d="M4 18C12 36 26 40 32 40C38 40 52 36 60 18C48 24 38 24 32 20C26 24 16 24 4 18Z" fill="url(#lg)"/><ellipse cx="22" cy="9" rx="8" ry="2.4" fill="#fff" opacity=".4"/><ellipse cx="32" cy="31" rx="9" ry="2.2" fill="#fff" opacity=".28"/></symbol>
  </defs></svg>

  <!-- MUSIC CONTROL -->
  <div id="music-control" class="music-ctrl">
    <button id="music-toggle" class="music-ctrl__btn" aria-label="Toggle music"><span id="music-icon">♪</span></button>
    <input type="range" id="volume-slider" class="music-ctrl__vol" min="0" max="1" step="0.05" value="0.4" aria-label="Volume">
  </div>
  <audio id="bg-music" loop preload="auto"></audio>

  <!-- PAGE 1: COUNTDOWN -->
  <div id="page-countdown" class="page page--active" data-page="1">
    <canvas id="star-canvas" class="page__canvas"></canvas>
    <div class="page__content countdown-page">
      <p class="countdown-page__tagline" id="waiting-msg"></p>
      <h1 class="countdown-page__name" id="hero-name"></h1>
      <div class="countdown-page__timer" id="timer-container">
        <div class="timer-box"><span class="timer-box__num" id="cd-days">00</span><span class="timer-box__label">Din</span></div>
        <div class="timer-box"><span class="timer-box__num" id="cd-hours">00</span><span class="timer-box__label">Ghante</span></div>
        <div class="timer-box"><span class="timer-box__num" id="cd-mins">00</span><span class="timer-box__label">Minute</span></div>
        <div class="timer-box"><span class="timer-box__num" id="cd-secs">00</span><span class="timer-box__label">Second</span></div>
      </div>
      <div id="bday-arrived" hidden><h2 class="countdown-page__bday-text" id="bday-text"></h2></div>
      <button id="skip-btn" class="btn btn--outline">Skip Timer ⏩</button>
      <button id="enter-btn" class="btn btn--glow" hidden>Enter Your Universe 💛</button>
    </div>
  </div>

  <!-- PAGE 2: WELCOME -->
  <div class="page" data-page="2">
    <canvas class="page__canvas page__canvas--bg"></canvas>
    <div class="page__content welcome-page">
      <p class="welcome-page__line1 anim-up"></p>
      <h1 class="welcome-page__line2 anim-up anim-delay-1"></h1>
      <p class="welcome-page__line3 anim-up anim-delay-2"></p>
      <p class="welcome-page__subtitle anim-up anim-delay-3"></p>
      <button class="btn btn--glow nav-next anim-up anim-delay-4" data-next="3"></button>
    </div>
  </div>

  <!-- PAGE 3: STORY -->
  <div class="page" data-page="3">
    <div class="page__content story-page">
      <h2 class="section-title story-page__title anim-up"></h2>
      <p class="section-subtitle story-page__subtitle anim-up anim-delay-1"></p>
      <div id="story-paras"></div>
      <button class="btn btn--glow nav-next anim-up" data-next="4"></button>
    </div>
  </div>

  <!-- PAGE 4: THINGS I LOVE -->
  <div class="page" data-page="4">
    <div class="page__content lovethings-page">
      <h2 class="section-title anim-up"></h2>
      <p class="section-subtitle anim-up anim-delay-1"></p>
      <div class="lovethings-page__grid" id="love-grid"></div>
      <button class="btn btn--glow nav-next anim-up" data-next="5"></button>
    </div>
  </div>

  <!-- PAGE 5: MEMORIES -->
  <div class="page" data-page="5">
    <div class="page__content memories-page">
      <h2 class="section-title anim-up"></h2>
      <p class="section-subtitle anim-up anim-delay-1"></p>
      <div class="memories-page__timeline" id="timeline"></div>
      <button class="btn btn--glow nav-next anim-up" data-next="6"></button>
    </div>
  </div>

  <!-- PAGE 6: GALLERY -->
  <div class="page" data-page="6">
    <div class="page__content gallery-page">
      <h2 class="section-title anim-up"></h2>
      <p class="section-subtitle anim-up anim-delay-1"></p>
      <div class="gallery-page__grid" id="gallery-grid"></div>
      <button class="btn btn--glow nav-next anim-up" data-next="8"></button>
    </div>
  </div>

  <!-- PAGE 8: LOVE LETTER -->
  <div class="page" data-page="8">
    <div class="page__content letter-page">
      <h2 class="section-title anim-up" id="letter-title"></h2>
      <p class="section-subtitle anim-up anim-delay-1" id="letter-subtitle">Ek chhota sa khat dil se... sirf tumhare liye 💛</p>

      <div class="letter-page__envelope-wrap anim-up anim-delay-2">
        <div class="letter-page__envelope" id="envelope">
          <div class="letter-page__back"></div>
          <div class="letter-page__peek">
            <span class="letter-page__peek-tag">For Guddu 💛</span>
            <div class="letter-page__peek-lines"></div>
          </div>
          <div class="letter-page__pocket"></div>
          <div class="letter-page__flap" id="envelope-flap">
            <div class="letter-page__wax-seal">❤️</div>
          </div>
        </div>
      </div>

      <div class="letter-page__actions anim-up anim-delay-3">
        <button class="btn btn--glow" id="open-letter-btn"></button>
        <button class="btn btn--glow nav-next" data-next="9" id="letter-nav-next"></button>
      </div>
    </div>
  </div>

  <!-- FULL READING EXPERIENCE: THE LETTER PARCHMENT MODAL -->
  <div class="letter-modal" id="letter-modal" aria-hidden="true">
    <div class="letter-modal__backdrop" id="letter-backdrop"></div>
    <div class="letter-modal__dialog">
      <div class="letter-paper" id="letter-paper">
        <div class="letter-paper__header">
          <div class="letter-paper__stamp">
            <span>💌</span> <span>DUGGU KI GUDDU • 9 NOV 2026</span>
          </div>
          <button class="letter-paper__close-btn" id="close-letter-x" aria-label="Band karo">✕</button>
        </div>

        <div class="letter-paper__content" id="letter-inner">
          <div class="letter-page__text" id="letter-text"></div>
          <div class="letter-page__sig">
            <p class="letter-page__sig-text" id="sig-text"></p>
            <p class="letter-page__sig-name" id="sig-name"></p>
          </div>

          <div class="letter-paper__heart-glow" aria-hidden="true">
            <span class="glowing-heart-pulse">💖</span>
          </div>

          <div class="letter-paper__footer-actions">
            <button class="btn btn--pink letter-paper__proceed-btn" id="letter-proceed-btn" data-next="9">
              Aage chalo Guddu (Cake kaatna hai 🎂) →
            </button>
            <button class="btn btn--outline letter-paper__fold-btn" id="close-letter">
              Wapas band karo ✉️
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- PAGE 9: CAKE & CAKE CUTTING -->
  <div class="page" data-page="9">
    <div class="page__content cake-page">
      <h2 class="section-title anim-up" id="cake-title"></h2>
      <p class="section-subtitle anim-up anim-delay-1" id="cake-subtitle"></p>

      <!-- 3D Realistic Illustrated Birthday Cake Stage -->
      <div class="cake-page__stage anim-up anim-delay-2" id="cake-stage">
        <div class="cake-interactive-wrap" id="cake-interactive-wrap">
          <svg class="cake-main-svg" id="cake-main-svg" viewBox="0 0 380 340" width="100%">
            <defs>
              <!-- Platter & Metal Gradients -->
              <linearGradient id="platterGold" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0%" stop-color="#8a5c24" />
                <stop offset="20%" stop-color="#e8bf72" />
                <stop offset="45%" stop-color="#fff4d0" />
                <stop offset="70%" stop-color="#d4a558" />
                <stop offset="100%" stop-color="#7a4e1d" />
              </linearGradient>
              <radialGradient id="platterShine" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
                <stop offset="65%" stop-color="#fdf6e6" stop-opacity="0.4" />
                <stop offset="100%" stop-color="#d4a558" stop-opacity="0" />
              </radialGradient>

              <!-- Bottom Tier Cake (Strawberry Rose) -->
              <linearGradient id="tier1Side" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0%" stop-color="#ffb8cc" />
                <stop offset="25%" stop-color="#ff8da9" />
                <stop offset="60%" stop-color="#e6577b" />
                <stop offset="88%" stop-color="#c4335a" />
                <stop offset="100%" stop-color="#8a1838" />
              </linearGradient>
              <radialGradient id="tier1Top" cx="40%" cy="35%" r="65%">
                <stop offset="0%" stop-color="#ffd5e2" />
                <stop offset="40%" stop-color="#ff9eb7" />
                <stop offset="85%" stop-color="#ea5b80" />
                <stop offset="100%" stop-color="#b82a4f" />
              </radialGradient>

              <!-- Top Tier Cake (Ivory Vanilla Buttercream) -->
              <linearGradient id="tier2Side" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0%" stop-color="#fffbf2" />
                <stop offset="25%" stop-color="#faedd8" />
                <stop offset="65%" stop-color="#eed2b2" />
                <stop offset="90%" stop-color="#d6b088" />
                <stop offset="100%" stop-color="#9d744b" />
              </linearGradient>
              <radialGradient id="tier2Top" cx="40%" cy="35%" r="65%">
                <stop offset="0%" stop-color="#ffffff" />
                <stop offset="45%" stop-color="#ffeff3" />
                <stop offset="85%" stop-color="#fdd5df" />
                <stop offset="100%" stop-color="#e29bb0" />
              </radialGradient>

              <!-- Glaze Drips -->
              <linearGradient id="chocDrip" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#ff527b" />
                <stop offset="50%" stop-color="#d12351" />
                <stop offset="100%" stop-color="#690924" />
              </linearGradient>

              <!-- Cut Wedge Cake Interior (Fluffy Sponge + Jam + Cream) -->
              <linearGradient id="spongeInside" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0%" stop-color="#fdf3e3" />
                <stop offset="50%" stop-color="#fae3c3" />
                <stop offset="100%" stop-color="#ecc493" />
              </linearGradient>
              <linearGradient id="berryJam" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0%" stop-color="#ff1a60" />
                <stop offset="50%" stop-color="#c70842" />
                <stop offset="100%" stop-color="#700021" />
              </linearGradient>

              <!-- Candles & Flames -->
              <linearGradient id="candlePink" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0%" stop-color="#ffffff" />
                <stop offset="40%" stop-color="#ffc2d4" />
                <stop offset="100%" stop-color="#e27393" />
              </linearGradient>
              <linearGradient id="candleGold" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0%" stop-color="#ffffff" />
                <stop offset="40%" stop-color="#ffe8a3" />
                <stop offset="100%" stop-color="#e0a838" />
              </linearGradient>

              <radialGradient id="flameHalo" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stop-color="#ffeb3b" stop-opacity="0.95" />
                <stop offset="40%" stop-color="#ff9800" stop-opacity="0.6" />
                <stop offset="75%" stop-color="#ff5722" stop-opacity="0.2" />
                <stop offset="100%" stop-color="#ff5722" stop-opacity="0" />
              </radialGradient>
              <linearGradient id="flameGrad" x1="0" y1="1" x2="0" y2="0">
                <stop offset="0%" stop-color="#29b6f6" stop-opacity="0.95" />
                <stop offset="25%" stop-color="#ffca28" />
                <stop offset="60%" stop-color="#ffeb3b" />
                <stop offset="90%" stop-color="#ffffff" />
                <stop offset="100%" stop-color="#ffffff" />
              </linearGradient>
              <filter id="cakeGlow" x="-30%" y="-30%" width="160%" height="160%">
                <feGaussianBlur stdDeviation="3" result="b" />
                <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
              </filter>

              <!-- Knife Blade -->
              <linearGradient id="knifeBlade" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0%" stop-color="#ffffff" />
                <stop offset="40%" stop-color="#e8e8e8" />
                <stop offset="80%" stop-color="#b0b0b0" />
                <stop offset="100%" stop-color="#707070" />
              </linearGradient>
            </defs>

            <!-- Table Ambient Floor Shadow -->
            <ellipse cx="190" cy="318" rx="145" ry="16" fill="#000" opacity="0.45" />

            <!-- Pedestal Stand -->
            <ellipse cx="190" cy="312" rx="85" ry="12" fill="url(#platterGold)" />
            <path d="M180 310 Q180 286 186 274 L194 274 Q200 286 200 310 Z" fill="url(#platterGold)" />
            <ellipse cx="190" cy="274" rx="160" ry="24" fill="url(#platterGold)" />
            <ellipse cx="190" cy="272" rx="156" ry="21" fill="#fff" opacity="0.9" />
            <ellipse cx="190" cy="271" rx="150" ry="19" fill="url(#platterShine)" />

            <!-- MAIN INTACT 2-TIER CAKE -->
            <g id="cake-intact-body">
              <!-- TIER 1 (BOTTOM) Body -->
              <path d="M65 210 L65 264 C65 284 315 284 315 264 L315 210 Z" fill="url(#tier1Side)" />
              <!-- Bottom Tier pearl trim -->
              <path d="M65 258 C65 278 315 278 315 258" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-dasharray="1 8" fill="none" opacity="0.85" />
              <!-- Bottom Tier Top Surface -->
              <ellipse cx="190" cy="210" rx="125" ry="24" fill="url(#tier1Top)" />

              <!-- Bottom Tier Strawberry Glaze Drips -->
              <path d="M65 210
                       C72 225 78 232 84 226
                       C90 220 95 212 102 214
                       C110 216 116 238 124 238
                       C132 238 138 218 145 215
                       C152 212 158 228 165 225
                       C172 222 178 214 185 214
                       C192 214 198 234 206 234
                       C214 234 220 215 228 215
                       C236 215 242 229 250 226
                       C258 223 264 213 272 213
                       C280 213 286 236 294 236
                       C302 236 308 220 315 210
                       C315 222 65 222 65 210 Z"
                    fill="url(#chocDrip)" />

              <!-- Tier 1 Specular Highlight -->
              <ellipse cx="150" cy="207" rx="70" ry="12" fill="#ffffff" opacity="0.25" transform="rotate(-3 150 207)" />

              <!-- TIER 2 (TOP) Body -->
              <path d="M108 142 L108 192 C108 206 272 206 272 192 L272 142 Z" fill="url(#tier2Side)" />
              <!-- Tier 2 Base Cream Piping -->
              <path d="M108 188 C108 202 272 202 272 188" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 10" fill="none" opacity="0.9" />
              <!-- Tier 2 Top Surface -->
              <ellipse cx="190" cy="142" rx="82" ry="17" fill="url(#tier2Top)" />

              <!-- Tier 2 Glaze Drips -->
              <path d="M108 142
                       C114 154 118 160 124 154
                       C130 148 134 143 140 144
                       C146 145 152 162 158 162
                       C164 162 170 146 176 145
                       C182 144 188 158 194 156
                       C200 154 206 145 212 145
                       C218 145 224 161 230 161
                       C236 161 242 147 248 146
                       C254 145 260 155 266 152
                       C270 148 272 144 272 142
                       C272 150 108 150 108 142 Z"
                    fill="url(#chocDrip)" />
            </g>

            <!-- Revealing Cut Wedge Interior (reveals when cut) -->
            <g id="cake-cut-interior" opacity="0">
              <!-- Tier 1 Wedge Cut -->
              <path d="M190 210 L285 224 L285 272 C250 278 215 276 190 268 Z" fill="url(#spongeInside)" stroke="#caa67c" stroke-width="0.5" />
              <path d="M190 228 L285 240" stroke="url(#berryJam)" stroke-width="4.5" fill="none" />
              <path d="M190 246 L285 256" stroke="url(#berryJam)" stroke-width="4.5" fill="none" />
              <path d="M190 237 L285 248" stroke="#fff" stroke-width="3" stroke-dasharray="6 3" fill="none" opacity="0.9" />

              <!-- Tier 2 Wedge Cut -->
              <path d="M190 142 L255 152 L255 198 C230 202 205 200 190 194 Z" fill="url(#spongeInside)" stroke="#caa67c" stroke-width="0.5" />
              <path d="M190 160 L255 168" stroke="url(#berryJam)" stroke-width="4" fill="none" />
              <path d="M190 176 L255 184" stroke="url(#berryJam)" stroke-width="4" fill="none" />
            </g>

            <!-- GOURMET TOPPINGS & FRESH STRAWBERRIES -->
            <g id="cake-decorations">
              <!-- Tier 1 Rosettes around the ledge -->
              <circle cx="82" cy="214" r="8" fill="#fff5f8" />
              <circle cx="82" cy="214" r="2" fill="#ffd700" />
              <circle cx="102" cy="226" r="7.5" fill="#fff5f8" />
              <circle cx="280" cy="226" r="7.5" fill="#fff5f8" />
              <circle cx="300" cy="214" r="8" fill="#fff5f8" />
              <circle cx="300" cy="214" r="2" fill="#ffd700" />

              <!-- Tier 2 Top Buttercream Rosettes + Plump Strawberries -->
              <circle cx="120" cy="142" r="9" fill="#ffffff" />
              <path d="M120 128 C114 128 111 135 120 144 C129 135 126 128 120 128 Z" fill="#e6194b" />
              <circle cx="118" cy="133" r="0.8" fill="#fff" opacity="0.8" />
              <path d="M120 128 Q124 123 126 120" stroke="#2e7d32" stroke-width="1.6" fill="none" stroke-linecap="round" />

              <circle cx="145" cy="136" r="9" fill="#ffffff" />
              <circle cx="145" cy="136" r="2" fill="#ffd700" />

              <circle cx="190" cy="134" r="10" fill="#ffffff" />
              <path d="M190 118 C182 118 179 126 190 137 C201 126 198 118 190 118 Z" fill="#d90429" />
              <circle cx="187" cy="124" r="1" fill="#fff" opacity="0.85" />
              <path d="M190 118 Q195 112 198 108 M188 118 Q182 113 180 110" stroke="#2e7d32" stroke-width="1.8" fill="none" stroke-linecap="round" />

              <circle cx="235" cy="136" r="9" fill="#ffffff" />
              <circle cx="235" cy="136" r="2" fill="#ffd700" />

              <circle cx="260" cy="142" r="9" fill="#ffffff" />
              <path d="M260 128 C254 128 251 135 260 144 C269 135 266 128 260 128 Z" fill="#e6194b" />
              <circle cx="258" cy="133" r="0.8" fill="#fff" opacity="0.8" />
              <path d="M260 128 Q264 123 266 120" stroke="#2e7d32" stroke-width="1.6" fill="none" stroke-linecap="round" />

              <!-- Edible Golden Sprinkles -->
              <circle cx="165" cy="146" r="1.8" fill="#ffd700" />
              <circle cx="180" cy="150" r="1.8" fill="#ffffff" />
              <circle cx="205" cy="148" r="1.8" fill="#ffd700" />
              <circle cx="218" cy="145" r="1.8" fill="#ffffff" />
            </g>

            <!-- GOLDEN SPARKLING CAKE TOPPER -->
            <g id="cake-topper">
              <text x="190" y="80" text-anchor="middle" fill="url(#platterGold)" font-family="'Dancing Script', cursive" font-weight="700" font-size="22" filter="url(#cakeGlow)">
                Guddu Ji ❤️
              </text>
              <line x1="190" y1="84" x2="190" y2="128" stroke="url(#platterGold)" stroke-width="1.8" stroke-linecap="round" />
            </g>

            <!-- 5 REALISTIC BIRTHDAY CANDLES -->
            <g id="candles-group" style="cursor: pointer;">
              <!-- Candle 1 -->
              <g class="candle-svg-item" id="candle-svg-1" transform="translate(132, 95)">
                <rect x="0" y="24" width="7" height="36" rx="2.5" fill="url(#candlePink)" />
                <path d="M0 32 L7 36 M0 42 L7 46 M0 52 L7 56" stroke="#ff4081" stroke-width="2" opacity="0.8" />
                <path d="M3.5 24 Q3 17 4.5 13" stroke="#26150b" stroke-width="1.6" fill="none" stroke-linecap="round" />
                <path class="smoke-trail" d="M4.5 13 Q-4 4 6 -8 Q14 -18 3 -28" stroke="rgba(245,245,250,0.8)" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0" />
                <g class="candle-flame-element">
                  <ellipse cx="3.5" cy="6" rx="13" ry="17" fill="url(#flameHalo)" opacity="0.8" />
                  <path d="M3.5 13 C1 13 0 8 3.5 0 C7 8 6 13 3.5 13 Z" fill="url(#flameGrad)" />
                  <ellipse cx="3.5" cy="10" rx="1.8" ry="2.6" fill="#29b6f6" opacity="0.85" />
                </g>
              </g>

              <!-- Candle 2 -->
              <g class="candle-svg-item" id="candle-svg-2" transform="translate(160, 86)">
                <rect x="0" y="24" width="7" height="40" rx="2.5" fill="url(#candleGold)" />
                <path d="M0 32 L7 36 M0 42 L7 46 M0 52 L7 56" stroke="#f57c00" stroke-width="2" opacity="0.8" />
                <path d="M3.5 24 Q3 17 4.5 13" stroke="#26150b" stroke-width="1.6" fill="none" stroke-linecap="round" />
                <path class="smoke-trail" d="M4.5 13 Q-4 4 6 -8 Q14 -18 3 -28" stroke="rgba(245,245,250,0.8)" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0" />
                <g class="candle-flame-element">
                  <ellipse cx="3.5" cy="6" rx="14" ry="18" fill="url(#flameHalo)" opacity="0.85" />
                  <path d="M3.5 13 C1 13 0 8 3.5 0 C7 8 6 13 3.5 13 Z" fill="url(#flameGrad)" />
                  <ellipse cx="3.5" cy="10" rx="1.8" ry="2.6" fill="#29b6f6" opacity="0.85" />
                </g>
              </g>

              <!-- Candle 3 (Center) -->
              <g class="candle-svg-item" id="candle-svg-3" transform="translate(186.5, 80)">
                <rect x="0" y="24" width="7" height="42" rx="2.5" fill="url(#candlePink)" />
